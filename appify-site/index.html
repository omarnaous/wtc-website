<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Appify Studio</title>
    <meta name="description" content="Appify designs and builds websites, mobile apps, motion graphics and AI agents." />
    <meta name="theme-color" content="#0A0913" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" />
  </head>
  <body>
    <!-- Netlify Forms detects this static form at deploy time. The React form posts to it. -->
    <form name="demo-booking" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" /><input name="name" /><input name="email" /><input name="company" />
      <input name="services" /><input name="date" /><input name="time" /><input name="timezone" /><textarea name="notes"></textarea>
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
